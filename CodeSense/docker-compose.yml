services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devguide-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devguide}
      POSTGRES_USER: ${POSTGRES_USER:-devguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - devguide_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devguide_pg_data:
