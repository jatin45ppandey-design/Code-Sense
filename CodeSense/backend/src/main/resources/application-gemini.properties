# Deployment/cloud profile. All secrets are supplied by environment variables.
app.ai.provider=gemini
app.ai.chat-provider=gemini
app.ai.embedding-provider=gemini
app.ai.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
app.ai.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSION:768}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.ai.model.chat=google-genai
# Disable the Ollama/OpenAI embedding auto-configurations while enabling Google's text embedding model.
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-2.5-flash}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
spring.ai.google.genai.embedding.text.dimensions=${GEMINI_EMBEDDING_DIMENSION:768}

# A distinct table prevents vectors from different embedding spaces mixing if a database is shared by mistake.
spring.ai.vectorstore.pgvector.table-name=${GEMINI_VECTOR_TABLE:vector_store_gemini}
spring.ai.vectorstore.pgvector.dimensions=${GEMINI_EMBEDDING_DIMENSION:768}
