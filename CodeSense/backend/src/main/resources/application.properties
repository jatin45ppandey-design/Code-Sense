spring.application.name=backend

# =========================
# Environment
# =========================
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# =========================
# PostgreSQL
# =========================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/devguide}
spring.datasource.username=${DATABASE_USERNAME:devguide}
spring.datasource.password=${DATABASE_PASSWORD}

# =========================
# GitHub OAuth2
# =========================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.scope=read:user,repo

spring.security.oauth2.client.provider.github.user-name-attribute=id

# =========================
# Token Encryption
# =========================
app.token-encryption.password=${TOKEN_ENCRYPTION_PASSWORD}
app.token-encryption.salt=${TOKEN_ENCRYPTION_SALT}

# =========================
# Frontend
# =========================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# =========================
# Session
# =========================
server.servlet.session.cookie.name=DEVGUIDE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# Error Handling
# =========================
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# =========================
# AI - Local Ollama
# =========================
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.model=qwen3.5:2b
spring.ai.ollama.embedding.model=nomic-embed-text

# =========================
# PGVector
# =========================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# =========================
# Unused AI capabilities
# =========================
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
