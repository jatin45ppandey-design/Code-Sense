# Local development: preserve the existing Ollama models and PostgreSQL defaults.
app.ai.provider=local
app.ai.chat-provider=ollama
app.ai.embedding-provider=ollama
app.ai.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
app.ai.embedding-dimensions=${OLLAMA_EMBEDDING_DIMENSION:768}

spring.datasource.url=${LOCAL_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/devguide}}
spring.datasource.username=${LOCAL_DATABASE_USERNAME:${DATABASE_USERNAME:devguide}}
spring.datasource.password=${LOCAL_DATABASE_PASSWORD:${DATABASE_PASSWORD}}

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama
# The Google GenAI embedding starter is also on the classpath. Disable its
# auto-configuration explicitly so local mode has exactly one embedding model.
spring.ai.model.embedding.text=none
# Spring AI's Google connection-details auto-configuration initializes as soon
# as its starter is on the classpath, independently of the model selector.
# Local mode must exclude it so it never requires Gemini credentials.
spring.autoconfigure.exclude=org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen3.5:2b}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Keep the existing local table so already-indexed local repositories remain usable.
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=${OLLAMA_EMBEDDING_DIMENSION:768}
